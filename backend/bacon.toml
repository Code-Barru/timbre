#:schema https://dystroy.org/bacon/.bacon.schema.json
default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.build]
command = ["cargo", "build"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

# Mêmes flags que le hook `cargo-clippy` de prek.toml : ce qui est rouge ici
# est exactement ce qui bloquerait un commit.
[jobs.pedantic]
command = [
    "cargo", "clippy", "--all-targets",
    "--", "-W", "clippy::all", "-W", "clippy::pedantic",
]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true

# Build & run le serveur. Il ne s'arrête jamais tout seul, donc `background`
# est à false (la sortie est affichée en direct au lieu d'attendre la fin du
# process) et le process est tué puis relancé à chaque changement.
[jobs.run]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
scroll_anchor = "auto"

[keybindings]
r = "job:run"
