#:schema https://dystroy.org/bacon/.bacon.schema.json
default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.build]
command = ["cargo", "build"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

[jobs.pedantic]
command = [
    "cargo", "clippy", "--all-targets",
    "--", "-W", "clippy::all", "-W", "clippy::pedantic",
]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true

[jobs.run]
command = ["cargo", "run", "--features", "swagger"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
scroll_anchor = "auto"

[keybindings]
r = "job:run"
